<!doctype html>

  #headline { top:210px; left:40px; right:40px; text-align:center; font-weight:900; font-size:92px; line-height:1.02; letter-spacing:-1px;

  .chip i { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-style:normal; font-weight:900; font-size:36px; }
  .ok i { background:var(--green); } .no i { background:var(--red); } .coin i { background:var(--y); color:#0B1530; }
  #counter { top:1060px; left:0; right:0; text-align:center; }

  #counter .l { font-weight:800; font-size:52px; margin-top:4px; text-shadow:0 4px 18px rgba(0,0,0,.7); }
  #subs { left:50px; right:50px; top:1470px; text-align:center; font-weight:800; font-size:52px; line-height:1.28; }
  #subs .box { background:rgba(0,0,0,.66); padding:12px 24px; border-radius:20px; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  #subs .w { opacity:.55; } #subs .w.on { opacity:1; color:var(--y); }
  .lbl { font-weight:900; font-size:40px; padding:8px 20px; border-radius:14px; background:rgba(8,14,34,.82); border:3px solid var(--y); transform:translate(-50%,-100%); white-space:nowrap; }
  #cta { left:0; right:0; top:560px; perspective:1400px; }
  .card { margin:0 60px 30px; background:#fff; color:#0B1530; border-radius:34px; padding:26px 30px; display:flex; align-items:center; gap:24px;
    box-shadow:0 30px 70px rgba(0,0,0,.5); transform-style:preserve-3d; }
  .card .ic { width:96px; height:96px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; }
  .card .t1 { font-size:30px; font-weight:700; color:#5b6680; } .card .t2 { font-size:41px; font-weight:900; word-break:break-all; }
  #startbtn { margin:40px auto 0; width:max-content; padding:30px 70px; border-radius:999px; background:var(--y); color:#0B1530; font-weight:900; font-size:64px;
    box-shadow:0 14px 0 #b37a00, 0 30px 60px rgba(0,0,0,.5); }
  #flash { inset:0; background:#fff; opacity:0; }
  #vign { inset:0; background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
</style>
